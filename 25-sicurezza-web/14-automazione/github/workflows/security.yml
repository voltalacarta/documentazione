# =====================================================================
# GitHub Actions — controlli di sicurezza (rev. 2026-10-15)
# Copiare in .github/workflows/security.yml del repository.
#
# Cosa fa:
#   1. segreti   → Gitleaks su tutta la storia del repository
#   2. dipendenze → OSV-Scanner su tutti i lockfile
#   3. npm       → verifica firme/attestazioni del registro (se c'è package-lock.json)
#   4. workflow  → zizmor analizza i workflow GitHub Actions stessi
#   5. header    → check-headers.py sull'ambiente di staging (variabile STAGING_URL)
#   6. dast      → ZAP baseline (passivo) su staging, solo nel job programmato
#
# SICUREZZA DEL WORKFLOW:
#   - Le action sono indicate per tag per leggibilità. Prima dell'uso FISSALE
#     PER SHA (es. con "pinact run" o "npx pin-github-action"), poi lascia
#     che Dependabot le aggiorni (vedi dependabot.yml).
#   - I job usano immagini container ufficiali; fissale per digest in produzione.
# =====================================================================
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"     # ogni lunedì alle 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  segreti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --redact --verbose --exit-code 1

  dipendenze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: OSV-Scanner
        # Sintassi OSV-Scanner v2 (verificata): "scan source --recursive <dir>".
        # In alternativa all'immagine Docker esiste l'action ufficiale
        # google/osv-scanner-action (workflow riutilizzabile).
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:latest \
            scan source --recursive /src

  npm-firme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # hashFiles() non è utilizzabile nell'if del job: il controllo è negli step
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('package-lock.json') != '' }}
        with:
          node-version: "lts/*"
      - name: Installazione senza script di lifecycle
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci --ignore-scripts
      - name: Verifica firme e attestazioni del registro
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm audit signatures

  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: zizmor (analisi statica dei workflow)
        run: pipx run zizmor --min-severity medium .github/workflows

  header:
    runs-on: ubuntu-latest
    if: ${{ vars.STAGING_URL != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Header di sicurezza su staging
        env:
          URL: ${{ vars.STAGING_URL }}
        # lo script va copiato nel repository in security/check-headers.py
        run: python3 security/check-headers.py "$URL"

  dast:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' && vars.STAGING_URL != '' }}
    steps:
      - name: ZAP baseline (scansione passiva)
        env:
          URL: ${{ vars.STAGING_URL }}
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm -v "$PWD/zap:/zap/wrk" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "$URL" -r report.html -I
      - uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap/report.html
