# =====================================================================
# nginx — configurazione di sicurezza di base (rev. 2026-10-15)
# Uso: include /etc/nginx/snippets/security.conf; dentro ogni blocco server{}
# Attenzione: in nginx un add_header dentro "location" annulla quelli
# ereditati. Se aggiungi header in una location, includi di nuovo questo file.
# =====================================================================

# --- Informazioni sul server ---
server_tokens off;

# --- TLS (richiede OpenSSL 3.5+ per il gruppo post-quantum) ---
ssl_protocols TLSv1.2 TLSv1.3;
# Se la tua OpenSSL è < 3.5, rimuovi X25519MLKEM768 dalla lista.
ssl_ecdh_curve X25519MLKEM768:X25519:secp256r1;
# Cifrari TLS 1.2 (profilo Mozilla "Intermediate")
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;

# --- Header di sicurezza ---
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# CSP di base, applicata
add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

# CSP strict in sola osservazione. Il nonce va generato dall'applicazione:
# se l'app non lo fa, usa la variante con hash o lascia commentato.
# add_header Content-Security-Policy-Report-Only "script-src 'nonce-$request_id' 'strict-dynamic'; object-src 'none'; base-uri 'none'; report-uri /csp-report" always;

# --- File che non devono mai essere serviti ---
location ~ /\.(?!well-known) {
    deny all;
    return 404;
}
location ~* \.(bak|old|orig|save|swp|sql|sqlite|log|env|ini|conf|dist|zip|tar|gz|7z)$ {
    deny all;
    return 404;
}

# --- Limiti contro abuso e DoS applicativo ---
client_max_body_size 10m;      # adatta al caricamento massimo previsto
client_body_timeout 15s;
client_header_timeout 15s;
keepalive_timeout 30s;

# --- Rate limiting sul login (definire la zona nel blocco http{}):
#   limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
# poi, nel server{}:
#   location = /login { limit_req zone=login burst=5 nodelay; limit_req_status 429; proxy_pass ...; }

