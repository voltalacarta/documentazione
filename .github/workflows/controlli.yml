name: Controlli documentazione

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  formato:
    name: Formato Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"

  link:
    name: Link interni
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments "**/*.md"
          fail: true
